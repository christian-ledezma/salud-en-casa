[versions]
# Compilacion y analisis estatico
agp = "9.3.2"
kotlin = "2.4.20"
ktlintPlugin = "14.2.0"
ktlintEngine = "1.8.0"

# AndroidX
androidxCore = "1.19.0"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
androidxComposeBom = "2026.09.00"
androidxNavigation = "2.10.1"
androidxDatastore = "1.2.1"
androidxCredentials = "1.6.0"
androidxExifInterface = "1.4.1"

# Servicios de Google y mapas
googleid = "1.2.0"
playServicesLocation = "21.4.0"
mapsCompose = "8.6.0"
firebaseBom = "34.19.0"
googleServicesPlugin = "4.5.0"
crashlyticsPlugin = "3.0.8"

# Terceros
koin = "4.2.2"
supabase = "3.8.0"
ktor = "3.5.2"
kotlinxSerialization = "1.11.0"
coil = "3.6.2"

# Pruebas
junit = "4.13.2"
kotlinxCoroutinesTest = "1.11.0"
androidxTestJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
turbine = "1.2.1"
# Ejecuta las pruebas de interfaz de Compose en la JVM, sin emulador (RNF-07).
robolectric = "4.17"

[libraries]
# Declaraciones de versiones agrupadas. Se aplican con platform(...) y fijan la
# version de todo su grupo, de modo que los artefactos de abajo no la repiten.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }

# AndroidX, base
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

# Compose
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
# Core set only, never -extended: RNF-03 caps the package at 25 MB.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "androidxNavigation" }

# Sesion y preferencias
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDatastore" }

# Lectura de orientacion EXIF antes de comprimir una fotografia de documento
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "androidxExifInterface" }

# Ingreso con Google
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# Mapas y ubicacion
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
maps-compose-utils = { group = "com.google.maps.android", name = "maps-compose-utils", version.ref = "mapsCompose" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# Monitoreo de fallos. Sin firebase-analytics: Crashlytics no lo exige y RNF-03
# limita el tamano del paquete.
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }

# Inyeccion de dependencias
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose" }

# Supabase. El motor de Ktor no es una eleccion propia: el cliente de Supabase
# exige que la aplicacion aporte uno.
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Imagenes
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# Pruebas
junit = { group = "junit", name = "junit", version.ref = "junit" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# La version coincide con la que resuelve el grafo de dependencias de la
# aplicacion: un desajuste entre el runtime y el dispatcher de prueba rompe
# runTest sin mensaje util.
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[bundles]
compose = [
    "androidx-activity-compose",
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
    "androidx-compose-material-icons-core",
    "androidx-compose-ui-text-google-fonts",
    "androidx-lifecycle-runtime-compose",
    "androidx-navigation-compose",
]
supabase = [
    "supabase-postgrest",
    "supabase-auth",
    "supabase-realtime",
    "supabase-storage",
    "supabase-functions",
    "ktor-client-android",
    "kotlinx-serialization-json",
]
maps = [
    "maps-compose",
    "maps-compose-utils",
    "play-services-location",
]
auth = [
    "androidx-credentials",
    "androidx-credentials-play-services-auth",
    "googleid",
]
test = [
    "junit",
    "turbine",
    "kotlinx-coroutines-test",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServicesPlugin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlyticsPlugin" }
