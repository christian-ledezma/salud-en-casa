# Interface tests run on the JVM. See docs/decisions.md, 2026-10-08.
#
# sdk: Robolectric 4.17 needs Java 21 to run SDK 37, and the project builds on
# Java 17. These are layout tests, so the level only has to be one the toolchain
# supports; minSdk is 26 and nothing here depends on the level.
sdk=35
# The narrowest width Android still ships, which is where a 200 % font scale
# clips: the HU-07 defect reproduces here and not on a 411 dp phone.
qualifiers=w320dp-h568dp-xhdpi
# The plain Application, not SaludEnCasaApplication: that one starts Koin, and a
# content function receives its state as a parameter and injects nothing.
application=android.app.Application
# Real text measurement: the default mode stubs out the font engine, so every
# Text measured a few dp and no layout assertion meant anything.
graphicsMode=NATIVE
