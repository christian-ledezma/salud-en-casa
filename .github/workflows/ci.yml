name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static analysis, tests and debug build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle with dependency caching
        uses: gradle/actions/setup-gradle@v6

      # RNF-06: no credential lives in the repository. The build reads these
      # from local.properties, so continuous integration rebuilds that file from
      # the repository secrets. Values travel through the environment instead of
      # being interpolated into the script, so that a secret can never be read
      # as a shell command. sdk.dir is omitted: the runner exports ANDROID_HOME.
      - name: Write the credentials the build needs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY"
            printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID"
          } > local.properties
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          if [ ! -s app/google-services.json ]; then
            echo "The GOOGLE_SERVICES_JSON secret is missing or is not valid base64." >&2
            exit 1
          fi

      - name: Static analysis
        run: ./gradlew staticAnalysis

      - name: Unit tests
        run: ./gradlew test

      - name: Debug build
        run: ./gradlew assembleDebug
